<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 380px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; }
    .header { padding: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); text-align: center; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .tabs { display: flex; border-bottom: 1px solid #333; }
    .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 13px; transition: all 0.3s; border-bottom: 2px solid transparent; }
    .tab.active { border-bottom-color: #667eea; color: #667eea; }
    .tab:hover { background: rgba(102,126,234,0.1); }
    .panel { display: none; padding: 16px; max-height: 500px; overflow-y: auto; }
    .panel.active { display: block; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 6px; color: #aaa; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #444; border-radius: 8px;
      background: #16213e; color: #eee; font-size: 13px; outline: none; transition: border 0.3s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #667eea; }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .preset-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .preset-tag {
      padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer;
      background: #16213e; border: 1px solid #444; transition: all 0.3s;
    }
    .preset-tag:hover, .preset-tag.active { background: #667eea; border-color: #667eea; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 500; transition: all 0.3s;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary { background: #16213e; color: #eee; border: 1px solid #444; }
    .btn-secondary:hover { background: #1f2b47; }
    .status-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: #0f0f23; border-top: 1px solid #333; font-size: 12px;
    }
    .status-indicator { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #28a745; }
    .status-dot.error { background: #dc3545; }
    .status-dot.warn { background: #ffc107; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .toggle-switch { position: relative; width: 44px; height: 24px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: #444; border-radius: 24px; transition: 0.3s;
    }
    .toggle-slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: 0.3s;
    }
    .toggle-switch input:checked + .toggle-slider { background: #667eea; }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(20px); }
    .engine-list { margin-top: 10px; }
    .engine-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px; background: #16213e; border-radius: 8px; margin-bottom: 8px;
    }
    .engine-info { flex: 1; }
    .engine-name { font-size: 13px; font-weight: 500; }
    .engine-url { font-size: 11px; color: #888; margin-top: 2px; }
    .engine-actions { display: flex; gap: 6px; }
    .icon-btn { padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; border: 1px solid #444; background: transparent; color: #eee; }
    .icon-btn:hover { background: rgba(102,126,234,0.2); }
    .test-result { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 12px; display: none; }
    .test-result.success { background: rgba(40,167,69,0.2); color: #28a745; display: block; }
    .test-result.error { background: rgba(220,53,69,0.2); color: #dc3545; display: block; }
    .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #667eea; }
    .shortcut-hint { font-size: 11px; color: #888; margin-top: 8px; }
    .logs-area { background: #0f0f23; border-radius: 8px; padding: 10px; font-size: 11px; max-height: 150px; overflow-y: auto; font-family: monospace; }
    .log-entry { margin-bottom: 4px; }
    .log-time { color: #888; }
    .log-info { color: #17a2b8; }
    .log-error { color: #dc3545; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌙 immersive-translator</h1>
    <p>沉浸式翻译</p>
  </div>
  
  <div class="tabs">
    <div class="tab active" data-panel="translate">翻译</div>
    <div class="tab" data-panel="engines">引擎</div>
    <div class="tab" data-panel="settings">设置</div>
    <div class="tab" data-panel="logs">日志</div>
  </div>
  
  <div id="translate-panel" class="panel active">
    <div class="toggle-row">
      <span>启用网页翻译</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enable-translate">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>双语对照模式</span>
      <label class="toggle-switch">
        <input type="checkbox" id="bilingual-mode" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>划词翻译</span>
      <label class="toggle-switch">
        <input type="checkbox" id="selection-translate">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>输入框翻译</span>
      <label class="toggle-switch">
        <input type="checkbox" id="input-translate">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="form-group">
      <label>目标语言</label>
      <select id="target-lang">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁体中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
      </select>
    </div>
    <div class="shortcut-hint">快捷键: Alt+T 翻译当前页 | Alt+S 划词翻译</div>
  </div>
  
  <div id="engines-panel" class="panel">
    <div class="section-title">翻译引擎</div>
    <div class="preset-tags">
      <span class="preset-tag active" data-preset="openai">OpenAI</span>
      <span class="preset-tag" data-preset="deepseek">DeepSeek</span>
      <span class="preset-tag" data-preset="aliyun">阿里云</span>
      <span class="preset-tag" data-preset="ollama">Ollama</span>
      <span class="preset-tag" data-preset="custom">自定义</span>
    </div>
    <div class="form-group" style="margin-top: 14px;">
      <label>API Base URL</label>
      <input type="text" id="api-base" placeholder="https://api.openai.com/v1">
    </div>
    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="api-key" placeholder="sk-...">
    </div>
    <div class="form-group">
      <label>模型名称</label>
      <input type="text" id="model-name" placeholder="gpt-4o-mini">
    </div>
    <div class="form-group">
      <label>温度 (Temperature)</label>
      <input type="number" id="temperature" min="0" max="2" step="0.1" value="0.3">
    </div>
    <div class="form-group">
      <label>系统提示词</label>
      <textarea id="system-prompt" placeholder="你是一个专业翻译助手...">你是一个专业翻译助手。将用户输入的文本翻译成目标语言，保持原文的语气和风格。只输出翻译结果，不添加解释。</textarea>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 12px;">
      <button class="btn btn-primary" id="save-engine">保存引擎</button>
      <button class="btn btn-secondary" id="test-engine">测试连接</button>
    </div>
    <div class="test-result" id="test-result"></div>
    <div class="section-title" style="margin-top: 20px;">已保存引擎</div>
    <div class="engine-list" id="engine-list"></div>
  </div>
  
  <div id="settings-panel" class="panel">
    <div class="section-title">显示设置</div>
    <div class="form-group">
      <label>翻译字体大小</label>
      <input type="range" id="font-size" min="12" max="20" value="14" style="width: 100%;">
    </div>
    <div class="form-group">
      <label>翻译颜色</label>
      <input type="color" id="trans-color" value="#667eea" style="width: 100%; height: 36px;">
    </div>
    <div class="toggle-row">
      <span>显示原文</span>
      <label class="toggle-switch">
        <input type="checkbox" id="show-original" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>悬停翻译</span>
      <label class="toggle-switch">
        <input type="checkbox" id="hover-translate">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="section-title" style="margin-top: 16px;">高级</div>
    <div class="toggle-row">
      <span>自动检测语言</span>
      <label class="toggle-switch">
        <input type="checkbox" id="auto-detect" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>缓存翻译结果</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enable-cache" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="form-group">
      <label>并行请求数</label>
      <input type="number" id="max-concurrent" min="1" max="10" value="3">
    </div>
    <button class="btn btn-primary" id="save-settings" style="margin-top: 12px;">保存设置</button>
  </div>
  
  <div id="logs-panel" class="panel">
    <div class="section-title">运行日志</div>
    <div class="logs-area" id="logs-area"></div>
    <button class="btn btn-secondary" id="clear-logs" style="margin-top: 10px;">清除日志</button>
  </div>
  
  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">就绪</span>
    </div>
    <span id="version">v1.0.0</span>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
