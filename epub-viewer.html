<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ePub 翻译 - immersive-translator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
    .header { padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); text-align: center; }
    .header h1 { font-size: 24px; font-weight: 600; }
    .header p { font-size: 14px; opacity: 0.8; margin-top: 4px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .drop-zone {
      border: 2px dashed #667eea; border-radius: 12px; padding: 60px 20px;
      text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px;
    }
    .drop-zone:hover, .drop-zone.dragover { background: rgba(102,126,234,0.1); border-color: #764ba2; }
    .drop-zone h2 { font-size: 18px; margin-bottom: 10px; color: #667eea; }
    .drop-zone p { font-size: 14px; color: #888; }
    .drop-zone input { display: none; }
    .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; margin: 20px 0; overflow: hidden; display: none; }
    .progress-bar .fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; transition: width 0.3s; }
    .chapter-list { margin-bottom: 20px; }
    .chapter-item { padding: 12px 16px; background: #16213e; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .chapter-item .title { font-size: 14px; }
    .chapter-item .status { font-size: 12px; color: #888; }
    .chapter-item .status.done { color: #28a745; }
    .chapter-item .status.error { color: #dc3545; }
    .chapter-item .status.translating { color: #667eea; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .controls button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #16213e; color: #eee; border: 1px solid #444; }
    .btn-secondary:hover { background: #1f2b47; }
    .status { padding: 10px 16px; background: #16213e; border-radius: 6px; margin-bottom: 20px; font-size: 13px; }
    .status.success { border-left: 3px solid #28a745; }
    .status.error { border-left: 3px solid #dc3545; }
    .status.info { border-left: 3px solid #667eea; }
    .book-info { padding: 16px; background: #16213e; border-radius: 8px; margin-bottom: 20px; }
    .book-info h3 { font-size: 16px; margin-bottom: 8px; }
    .book-info p { font-size: 13px; color: #888; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📖 ePub 翻译</h1>
    <p>上传 ePub 电子书，获取双语对照翻译</p>
  </div>
  
  <div class="container">
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".epub">
      <h2>拖放 ePub 文件到此处</h2>
      <p>或点击选择文件</p>
    </div>
    
    <div class="progress-bar" id="progress-bar">
      <div class="fill" id="progress-fill"></div>
    </div>
    
    <div class="book-info" id="book-info" style="display: none;">
      <h3 id="book-title">未知书名</h3>
      <p id="book-author">作者：未知</p>
      <p id="book-chapters">章节数：0</p>
    </div>
    
    <div class="controls" id="controls" style="display: none;">
      <button class="btn-primary" id="btn-translate">开始翻译</button>
      <button class="btn-secondary" id="btn-download">下载翻译版 ePub</button>
      <button class="btn-secondary" id="btn-clear">清除</button>
    </div>
    
    <div class="status" id="status" style="display: none;"></div>
    
    <div class="chapter-list" id="chapter-list"></div>
  </div>
  
  <script src="epub-translator.js"></script>
</body>
</html>
